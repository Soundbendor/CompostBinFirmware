[project]
name = "compostbinfirmware"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "adafruit-blinka>=9.1.0",
    "adafruit-circuitpython-mlx90640>=1.3.9",
    "adafruit-circuitpython-neopixel-spi>=1.0.16",
    # faster-whisper 1.2.1 uses av.open(metadata_errors=...), removed in PyAV 19.
    "av==17.0.1",
    "balena-sdk==17.3.0",
    "bluez-peripheral>=0.1.7",
    "faster-whisper==1.2.1",
    "gpiod>=2.4.2",
    "httpx>=0.28.1",
    # The Docker build downloads the pinned transcription model snapshot.
    "huggingface-hub>=1.33.0",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pyaudio>=0.2.14",
    "pynau7802>=0.2.2",
    # Keep existing GPIO backends until they are validated on the deployed Pi.
    "rpi-gpio>=0.7.1",
    "rpi-ws281x>=5.0.0",
    # Required by the vendored BSEC setup.py install in the Docker build.
    "setuptools==81.0.0",
    "smbus2>=0.4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.uv]
override-dependencies = ["smbus2==0.6.1"]

